<!doctype html><html lang="es"><meta charset="utf-8"><title>Reel · primer cuadro (gancho)</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#140D08;font-family:"Nunito Sans",sans-serif}
.stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-60px;background:url(fondo-salon-equinoccio.jpg) center/cover;animation:kb 3s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,8,.74) 0%,rgba(20,12,8,.55) 30%,rgba(20,12,8,.6) 62%,rgba(20,12,8,.88) 100%),radial-gradient(90% 55% at 50% 52%,rgba(217,140,43,.20),transparent 70%)}
.logo{position:absolute;left:50%;top:330px;width:150px;margin-left:-75px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));animation:fade .6s .1s both}
.card{position:absolute;left:70px;right:70px;top:560px;padding:64px 56px 70px;border-radius:44px;background:rgba(27,18,12,.78);border:3px solid rgba(233,184,115,.75);box-shadow:0 30px 70px rgba(0,0,0,.55);text-align:center;animation:rise .7s .15s cubic-bezier(.2,.8,.2,1) both}
.cup{width:120px;height:120px;margin:0 auto 6px;display:block}
.steam{animation:steam 1.6s ease-in-out infinite}
.h{font:400 154px/1 "Young Serif",serif;color:#F8DDA6;letter-spacing:.01em;text-shadow:0 6px 24px rgba(0,0,0,.5);animation:pop .55s .45s cubic-bezier(.2,1.6,.4,1) both}
.line{width:240px;height:6px;margin:26px auto 34px;background:linear-gradient(90deg,transparent,#E9B873,transparent);animation:grow .5s .8s both;transform-origin:center}
.t{font:800 62px/1.25 "Nunito Sans",sans-serif;color:#FFF8EE}
.t span{display:inline-block;opacity:0;animation:word .45s both}
.t em{font-style:normal;color:#F2B766}
.handle{position:absolute;left:0;right:0;top:1500px;text-align:center;font:800 40px/1 "Nunito Sans",sans-serif;letter-spacing:.06em;color:#F5E6CF;text-shadow:0 3px 12px rgba(0,0,0,.7);animation:fade .6s 2.1s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(70px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes word{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-6px);opacity:.6}}
</style>
<body><div class="stage">
<div class="bg"></div><div class="shade"></div>
<img class="logo" src="../../assets/logo.png" alt="">
<div class="card">
 <svg class="cup" viewBox="0 0 64 64" fill="none" stroke="#E9B873" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 28h34v12a14 14 0 0 1-14 14h-6a14 14 0 0 1-14-14z"/><path d="M46 31h5a5.5 5.5 0 0 1 0 11h-5"/><path d="M8 58h42"/><g class="steam"><path d="M22 10c-4 5 4 6 0 12M31 10c-4 5 4 6 0 12M40 10c-4 5 4 6 0 12"/></g></svg>
 <div class="h">¡ESPERA!</div><div class="line"></div>
 <p class="t" id="t"></p>
</div>
<p class="handle">@equinocciocafelibro</p>
</div>
<script>
const words="Hay un lugar en Cajicá donde el café tiene otra historia...".split(" ");
const t=document.getElementById("t");
t.innerHTML=words.map((w,i)=>`<span style="animation-delay:${(1.0+i*0.11).toFixed(2)}s">${i>=7?'<em>'+w+'</em>':w}</span>`).join(" ");
</script></body></html>
